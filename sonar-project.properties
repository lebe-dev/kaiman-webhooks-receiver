sonar.projectKey=webhooks-proxy
sonar.projectName=Kaiman Webhooks Proxy
sonar.sourceEncoding=UTF-8

# Only hand-written project sources. Everything else (build output in `target/`
# and `static/`, `node_modules/`, the SQLite data dir, fixtures in `test-data/`,
# user docs, coverage reports) is deliberately outside this list, so no
# `sonar.exclusions` entry is needed to keep it out.
sonar.sources=src,frontend/src,helm-chart,Dockerfile,docker-compose.yml

# `frontend/src/lib/components/ui/**` is generated by shadcn-svelte — it is
# vendored code, not ours to fix (it is excluded from eslint for the same reason).
sonar.exclusions=frontend/src/lib/components/ui/**

# Rust coverage. Written by `just coverage`, which also rewrites the absolute
# paths llvm-cov records into project-relative ones — the scanner runs in a
# container where the project lives at a different path.
sonar.rust.lcov.reportPaths=coverage/lcov.info

# Clippy findings are produced by `just clippy-report` on the host: the
# sonar-scanner-cli image has no Rust toolchain, so the scanner cannot run
# clippy itself and would report nothing.
sonar.rust.clippy.enabled=false
sonar.rust.clippyReport.reportPaths=coverage/clippy-report.json
sonar.rust.cargo.manifestPaths=Cargo.toml
